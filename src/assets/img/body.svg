<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Steam rising in layered bands of light">

  <defs>
    <linearGradient id="steamBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E7A6A"/>
      <stop offset="46%" stop-color="#1B3229"/>
      <stop offset="100%" stop-color="#0B1614"/>
    </linearGradient>
    <radialGradient id="steamLight" cx="50%" cy="16%" r="70%">
      <stop offset="0%" stop-color="#FFFBF2" stop-opacity="0.62"/>
      <stop offset="52%" stop-color="#E8E3D8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0B1614" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="bodySteam" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.032" numOctaves="4" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="6" result="soft"/>
      <feColorMatrix in="soft" type="matrix"
        values="0 0 0 0 0.91
                0 0 0 0 0.89
                0 0 0 0 0.84
                0 0 0 0.55 -0.06"/>
    </filter>
    
    <filter id="bodyGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#steamBg)"/>
  <rect width="900" height="1200" fill="url(#steamLight)"/>
