<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="A polished brass bowl catching the light">

  <defs>
    <linearGradient id="bowlBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1614"/>
      <stop offset="100%" stop-color="#12211D"/>
    </linearGradient>
    <linearGradient id="bowlMetal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#DCBE86"/>
      <stop offset="42%" stop-color="#B8934F"/>
      <stop offset="70%" stop-color="#7A5F2A"/>
      <stop offset="100%" stop-color="#DCBE86" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="bowlGlow" cx="50%" cy="50%" r="56%">
      <stop offset="0%" stop-color="#B8934F" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0B1614" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="bowlGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bowlBg)"/>
  <rect width="900" height="1200" fill="url(#bowlGlow)"/>

  <!-- shadow on the surface it stands on -->
  <ellipse cx="450" cy="880" rx="290" ry="40" fill="#0B1614" fill-opacity="0.6"/>

  <!-- bowl body: a hemisphere sitting under its rim -->
  <path d="M 200 588 A 250 250 0 0 0 700 588 Z"
        fill="url(#bowlMetal)"/>
  <!-- inner shadow, so it reads as hollow rather than solid -->
  <ellipse cx="450" cy="588" rx="250" ry="76" fill="#0B1614" fill-opacity="0.62"/>
  <ellipse cx="450" cy="594" rx="214" ry="60" fill="#7A5F2A" fill-opacity="0.55"/>
  <!-- rim -->
  <ellipse cx="450" cy="588" rx="250" ry="76" fill="none"
           stroke="#DCBE86" stroke-opacity="0.95" stroke-width="6"/>
  <!-- specular highlight down the belly -->
  <path d="M 292 672 A 232 232 0 0 0 398 816"
        fill="none" stroke="#FFF6E2" stroke-opacity="0.6" stroke-width="14" stroke-linecap="round"/>
  <path d="M 570 700 A 232 232 0 0 1 490 820"
        fill="none" stroke="#FFF6E2" stroke-opacity="0.28" stroke-width="8" stroke-linecap="round"/>

  <rect width="900" height="1200" filter="url(#bowlGrain)" opacity="0.2"/>

</svg>