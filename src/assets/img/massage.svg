<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Warm oil pooling in concentric rings">

  <defs>
    <linearGradient id="oilBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B3229"/>
      <stop offset="100%" stop-color="#0B1614"/>
    </linearGradient>
    <radialGradient id="oilPool" cx="50%" cy="56%" r="56%">
      <stop offset="0%" stop-color="#FFF1D8" stop-opacity="0.80"/>
      <stop offset="26%" stop-color="#DCBE86" stop-opacity="0.52"/>
      <stop offset="62%" stop-color="#B8934F" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0B1614" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="oilGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#oilBg)"/>
  <rect width="900" height="1200" fill="url(#oilPool)"/>
