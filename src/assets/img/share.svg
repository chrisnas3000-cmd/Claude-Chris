<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" >

  <defs>
    <linearGradient id="shareBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1614"/>
      <stop offset="60%" stop-color="#12211D"/>
      <stop offset="100%" stop-color="#1B3229"/>
    </linearGradient>
    <linearGradient id="shareArch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCBE86" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#A8695B" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="shareGlow" cx="76%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#B8934F" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0B1614" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shareClip">
      <path d="M 0 330 L 0 171.6 C 0 58.344, 47.5 0, 125 0 C 202.5 0, 250 58.344, 250 171.6 L 250 330 Z" transform="translate(840 150)"/>
    </clipPath>
    
    <filter id="shareSteam" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.028" numOctaves="3" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="6" result="soft"/>
      <feColorMatrix in="soft" type="matrix"
        values="0 0 0 0 0.91
                0 0 0 0 0.89
                0 0 0 0 0.84
                0 0 0 0.55 -0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#shareBg)"/>
  <rect width="1200" height="630" fill="url(#shareGlow)"/>

  <g clip-path="url(#shareClip)">
    <rect x="840" y="150" width="250" height="330" fill="url(#shareArch)"/>
    <rect x="840" y="150" width="250" height="330" filter="url(#shareSteam)" opacity="0.45"/>
  </g>
  <path d="M 0 330 L 0 171.6 C 0 58.344, 47.5 0, 125 0 C 202.5 0, 250 58.344, 250 171.6 L 250 330 Z" transform="translate(840 150)"
        fill="none" stroke="#DCBE86" stroke-opacity="0.6" stroke-width="2.5"/>

  <text x="110" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="76"
        fill="#E8E3D8">Teena&apos;z Spa</text>
  <text x="110" y="330" font-family="Helvetica, Arial, sans-serif" font-size="27"
        letter-spacing="3" fill="#B8934F">SPA, MASSAGE &amp; BEAUTY</text>
  <line x1="110" y1="372" x2="330" y2="372" stroke="#B8934F" stroke-opacity="0.6" stroke-width="2"/>
  <text x="110" y="424" font-family="Helvetica, Arial, sans-serif" font-size="25"
        fill="#A2AEA7">Sodeco, Achrafieh · Beirut, Lebanon</text>
  <text x="110" y="464" font-family="Helvetica, Arial, sans-serif" font-size="25"
        fill="#A2AEA7">Open until 11 PM, seven days a week</text>

</svg>