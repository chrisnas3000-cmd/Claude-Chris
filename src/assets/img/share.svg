<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Teena&apos;z Spa — spa, massage and beauty in Sodeco, Achrafieh">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDFC"/>
      <stop offset="62%" stop-color="#F7F2EA"/>
      <stop offset="100%" stop-color="#DDD0BE"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#A87955" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#F7F2EA" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(96 92) scale(2.2)">
  <circle cx="16" cy="16" r="15" fill="none" stroke="#A87955" stroke-width="1" opacity="1"/>
  <path d="M16 6c4.4 3.2 6.6 6.6 6.6 10a6.6 6.6 0 0 1-13.2 0C9.4 12.6 11.6 9.2 16 6Z"
        fill="none" stroke="#A87955" stroke-width="1.3"/>
  <path d="M16 12v9" fill="none" stroke="#A87955" stroke-width="1.3" opacity="0.55"/></g>

  <text x="96" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="82"
        fill="#29211D">Teena&apos;z Spa</text>
  <text x="96" y="356" font-family="Helvetica, Arial, sans-serif" font-size="24"
        letter-spacing="4" fill="#75502F">SPA, MASSAGE &amp; BEAUTY</text>

  <line x1="96" y1="404" x2="300" y2="404" stroke="#A87955" stroke-width="2" opacity="0.7"/>

  <text x="96" y="462" font-family="Helvetica, Arial, sans-serif" font-size="25"
        fill="#5A524C">Sodeco, Achrafieh · Beirut, Lebanon</text>
  <text x="96" y="502" font-family="Helvetica, Arial, sans-serif" font-size="25"
        fill="#5A524C">Open until 11 PM, seven days a week</text>

  <rect width="1200" height="630" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:multiply"/>
</svg>