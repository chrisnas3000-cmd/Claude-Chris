<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-label="A lit archway leading into a steam room">

  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1614"/>
      <stop offset="52%" stop-color="#1B3229"/>
      <stop offset="100%" stop-color="#0B1614"/>
    </linearGradient>
    <radialGradient id="glow" cx="63%" cy="62%" r="48%">
      <stop offset="0%" stop-color="#B8934F" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#B8934F" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B1614" stop-opacity="0"/>
    </radialGradient>
    <!-- Warm and low, not bright: the headline is set over this, so the
         opening has to read as a glow rather than as a lit panel. -->
    <linearGradient id="doorway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8934F" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#B8934F" stop-opacity="0.46"/>
      <stop offset="74%" stop-color="#A8695B" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#7A5F2A" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1614" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B1614" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCBE86" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#DCBE86" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="archClip">
      <path d="M 0 720 L 0 374.40000000000003 C 0 127.29600000000002, 95 0, 250 0 C 405 0, 500 127.29600000000002, 500 374.40000000000003 L 500 720 Z" transform="translate(758 340)"/>
    </clipPath>
    
    <filter id="steam" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.024" numOctaves="4" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="6" result="soft"/>
      <feColorMatrix in="soft" type="matrix"
        values="0 0 0 0 0.91
                0 0 0 0 0.89
                0 0 0 0 0.84
                0 0 0 0.55 -0.06"/>
    </filter>
    
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.34"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#room)"/>
  <rect width="1600" height="1100" fill="url(#glow)"/>

  <!-- the lit doorway -->
  <g clip-path="url(#archClip)">
    <rect x="758" y="340" width="500" height="720" fill="url(#doorway)"/>
    <rect x="758" y="340" width="500" height="720" filter="url(#steam)" opacity="0.55"/>
    <!-- steam curling through the opening -->
    <ellipse cx="1008" cy="844" rx="230" ry="172.79999999999998"
             fill="#FFF6E2" fill-opacity="0.12"/>
  </g>

  <!-- arch surround, drawn firmly so the shape is unmistakable -->
  <path d="M 0 720 L 0 374.40000000000003 C 0 127.29600000000002, 95 0, 250 0 C 405 0, 500 127.29600000000002, 500 374.40000000000003 L 500 720 Z" transform="translate(758 340)"
        fill="none" stroke="#DCBE86" stroke-opacity="0.95" stroke-width="4"/>
  <path d="M 0 754 L 0 392.08000000000004 C 0 133.30720000000002, 103.36 0, 272 0 C 440.64000000000004 0, 544 133.30720000000002, 544 392.08000000000004 L 544 754 Z" transform="translate(736 306)"
        fill="none" stroke="#DCBE86" stroke-opacity="0.30" stroke-width="1.8"/>
  <path d="M 0 788 L 0 409.76 C 0 139.3184, 111.72 0, 294 0 C 476.28000000000003 0, 588 139.3184, 588 409.76 L 588 788 Z" transform="translate(714 272)"
        fill="none" stroke="#DCBE86" stroke-opacity="0.12" stroke-width="1.4"/>

  <!-- the wall the arch is cut into, closing in from both sides -->
  <rect x="0" y="0" width="688" height="1100" fill="url(#wallL)"/>
  <rect x="0" y="0" width="272" height="1100" fill="url(#wallL)"
        transform="translate(1600, 0) scale(-1, 1)"/>

  <!-- floor line and the light spilling across it -->
  <ellipse cx="1008" cy="1060" rx="490" ry="70" fill="url(#floor)"/>
  <line x1="0" y1="1060" x2="1600" y2="1060"
        stroke="#B8934F" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- steam through the room -->
  <rect width="1600" height="1100" filter="url(#steam)" opacity="0.22"/>
  <rect width="1600" height="1100" filter="url(#grain)" opacity="0.26"/>

</svg>