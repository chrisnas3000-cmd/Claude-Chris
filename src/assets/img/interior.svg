<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A colonnade of arches receding into low light">

  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12211D"/>
      <stop offset="100%" stop-color="#0B1614"/>
    </linearGradient>
    <radialGradient id="far" cx="50%" cy="62%" r="38%">
      <stop offset="0%" stop-color="#FFF6E2" stop-opacity="0.92"/>
      <stop offset="34%" stop-color="#DCBE86" stop-opacity="0.46"/>
      <stop offset="70%" stop-color="#B8934F" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B1614" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="hallSteam" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.030" numOctaves="3" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="6" result="soft"/>
      <feColorMatrix in="soft" type="matrix"
        values="0 0 0 0 0.91
                0 0 0 0 0.89
                0 0 0 0 0.84
                0 0 0 0.55 -0.06"/>
    </filter>
    
    <filter id="hallGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#hall)"/>
  <rect width="1600" height="900" fill="url(#far)"/>
  
