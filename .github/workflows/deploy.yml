# Builds the site and publishes it to GitHub Pages.
#
# GitHub Pages serves a project repository from /<repo>/, so the build needs
# PATH_PREFIX set to that subpath — every internal link goes through Eleventy's
# `url` filter and picks it up. Both values below read the repository's own
# name, so renaming the repo is all it takes to move the site. On a custom
# domain served from the root, drop PATH_PREFIX and set SITE_URL to the domain.
#
# One-time setup, and it must be done by a human with admin rights — the
# workflow token cannot create a Pages site (it gets "Resource not accessible
# by integration"):
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/install-frontend-design-skills-4t9oy7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Both are derived from the repository itself, so renaming the repo moves the
  # site to its new address with nothing here to edit.
  PATH_PREFIX: /${{ github.event.repository.name }}/
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Catches broken links, missing assets and paths that skipped the url
      # filter. A failure here stops the deploy.
      - name: Check the build
        run: npm run check

      # Left on so this works by itself anywhere the token is allowed to enable
      # Pages. In this repository it is not, so the switch above has to be
      # thrown by hand once; after that this step simply finds the site.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
